function fit(k,m0){const m=m0.slice().sort((a,b)=>(a.y-b.y)||(a.x-b.x)),n=m.length;if(!n)return;const W=k.w-16,H=k.h-46;let best=null;
 for(let c=1;c<=n;c++){const rows=Math.ceil(n/c),cw=W/c,ch=H/rows,s=Math.min(cw-12,ch-34,90,cw*0.5);if(!best||s>best.s)best={c,cw,ch,s};}
 const s=Math.max(16,Math.floor(best.s));m.forEach((q,i)=>{const col=i%best.c,row=Math.floor(i/best.c);q.s=s;q.cw=Math.floor(best.cw);q.x=Math.round(k.x+8+col*best.cw);q.y=Math.round(k.y+40+row*best.ch+(best.ch-s-30)/2);});}

 BOTS.forEach(b=>{const p=S.pos[b.id];const el=document.createElement("div");el.className="bot";el.style.left=p.x+"px";el.style.top=p.y+"px";

 if(q&&svp&&!members(svp).includes(q)){const old=S.depts.filter(k=>members(k).includes(q));
  const sm=members(svp).sort((a,b)=>(a.y-b.y)||(a.x-b.x));const sk=S.pos["b45cc405-91e6-4b2b-89a1-252e840cce06"];
